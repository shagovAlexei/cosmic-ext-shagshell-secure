name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libcosmic pulls in the system graphics and Wayland stack; without these
      # the build fails at link time with errors that look unrelated to the code.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          # Pinned by commit, the action can't read the toolchain from its ref: said here.
          toolchain: stable
          components: rustfmt, clippy

      # libcosmic is a large git dependency; without a cache every run rebuilds
      # the whole tree.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs read main's cache; saving their own would only push it out (10 GB per repo).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The key follows Cargo.lock, not [profile.*]: bump this when the profiles change, or
          # main keeps restoring builds made with the old ones (and never saves new ones).
          key: profile-v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
