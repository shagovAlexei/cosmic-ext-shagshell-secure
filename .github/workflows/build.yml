name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libcosmic pulls in the system graphics and Wayland stack; without these
      # the build fails at link time with errors that look unrelated to the code.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # libcosmic is a large git dependency; without a cache every run rebuilds
      # the whole tree.
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs read main's cache; saving their own would only push it out (10 GB per repo).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The key follows Cargo.lock, not [profile.*]: bump this when the profiles change, or
          # main keeps restoring builds made with the old ones (and never saves new ones).
          key: profile-v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
