name: release

# Push a tag `vX.Y.Z` (matching `version` in Cargo.toml) → a GitHub release with the .deb;
# only the last 5 releases (and their tags) are kept.
# A PR changing this file builds the .deb only (an artifact, no release).
# A push to main builds it too, with no release: that run keeps the build cache. A tag can only
# read caches of its own ref and of main, so without it every release built all from scratch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'justfile']

permissions:
  contents: write

jobs:
  deb:
    # The oldest supported Ubuntu (glibc 2.35): the .deb then installs there and on everything
    # newer (Ubuntu 24.04, Pop!_OS 24.04, Mint 21 / 22, Debian 12…). Built on 24.04 it needed 2.39.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libegl1-mesa-dev libssl-dev pkg-config \
            dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's cache: a tag's would be read by nothing else (670 MB each).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `just` is not packaged in 22.04.
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in Cargo.toml"; exit 1; }

      - name: Build .deb
        run: just deb

      - name: Needs at most glibc 2.35
        run: |
          need=$(objdump -T target/release/shagshell | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35
          dpkg-deb -f target/deb/*.deb Depends

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd target/deb && sha256sum *.deb > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" target/deb/*.deb target/deb/SHA256SUMS --generate-notes

      - name: Keep the last 5 releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest first; everything after the fifth goes, with its tag.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: packages
          path: |
            target/deb/*.deb
           
