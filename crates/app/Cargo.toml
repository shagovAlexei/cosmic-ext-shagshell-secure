[package]
name = "shagshell"
description = "SecureCRT-style SSH/SFTP session manager for COSMIC"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shagshell-core = { path = "../core" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
log = "0.4"
simple_logger = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
polling = "3"
# Startup probe for the renderer (wgpu comes from libcosmic: `cosmic::iced::wgpu`).
pollster = "0.4"

# Terminal, adapted from cosmic-term: the emulator and the text it draws with (libcosmic's version).
alacritty_terminal = "0.25.1"
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache", "syntect", "vi"] }
# Notes: COSMIC Edit's editor (`editor/`), its syntax highlighting and themes.
syntect = "5.3"
two-face = "0.4.5"
cosmic-syntax-theme = { git = "https://github.com/pop-os/cosmic-syntax-theme.git", rev = "b1e1eb0234568911e59888f092dfc779c609b499" }
indexmap = "2"
tokio = { version = "1", features = ["rt", "sync"] }
# The file chooser portal, for the folder it opens in (libcosmic's dialog does not pass one).
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "ef490df50b0a05a21c494c3f75737581bf0b39d9"
default-features = false
features = ["tokio", "winit", "wayland", "wgpu", "multi-window", "about", "xdg-portal"]
